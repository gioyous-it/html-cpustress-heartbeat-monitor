<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}
.overlay{display:flex;align-items:center;gap:25px;padding:20px;width:max-content;height:max-content}
.watch{width:140px;height:140px;object-fit:contain}
.heartbeat{color:white;font-size:72px;font-weight:bold;line-height:1;min-width:150px}
</style>
</head>
<body>
<div class="overlay">
<img class="watch" src="watch.webp">
<div class="heartbeat" id="heartbeat">100</div>
</div>
<script>
let n=0;
let lastN=0;
let start=performance.now();
let value=0;
function benchmark(){
for(let i=0;i<100000;i++){value=(value+i)%1000000;n++}
const now=performance.now();
if(now-start>=1000){
const ratio=lastN?n/lastN:1;
const heartbeat=Math.floor(ratio*100);
document.getElementById("heartbeat").textContent=heartbeat;
lastN=n;
n=0;
start=now;
}
setTimeout(benchmark,0);
}
benchmark();
</script>
</body>
</html>
